# Runs the test suite and the worked example on every push and pull request.
# The example step fails if the regenerated results differ from the committed
# examples/outputs/stats.json, so the published numbers stay reproducible.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test,examples]"
      - name: Test suite
        run: python -m pytest -q
      - name: Reproduce the worked example
        run: |
          python examples/make_example_data.py > /dev/null
          python examples/run_example.py > /dev/null
          git diff --exit-code examples/data examples/outputs/stats.json
