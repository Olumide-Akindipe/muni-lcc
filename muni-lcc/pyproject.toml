[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muni-lcc"
version = "0.1.1"
description = "Open life-cycle cost and measurement-and-verification toolkit for municipal energy projects (FEMP M&V v5.0, IPMVP Options A and C, ASTM E917, 2 CFR 200.329 reporting)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephen Olumide Akindipe" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
keywords = ["life-cycle cost", "measurement and verification", "IPMVP", "FEMP", "municipal energy", "uniform guidance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7"]
examples = ["matplotlib>=3.5"]

[project.scripts]
muni-lcc = "muni_lcc.cli:main"

[project.urls]
Repository = "https://github.com/Olumide-Akindipe/muni-lcc"
Documentation = "https://github.com/Olumide-Akindipe/muni-lcc/blob/main/docs/METHODS.md"
Changelog = "https://github.com/Olumide-Akindipe/muni-lcc/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.23362541"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
