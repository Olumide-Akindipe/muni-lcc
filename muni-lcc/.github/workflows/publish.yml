# Publishes the package to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing: no API token is stored in this repository.
# One-time setup on PyPI: add a (pending) trusted publisher for project
# "muni-lcc", owner "Olumide-Akindipe", repository "muni-lcc",
# workflow "publish.yml", environment "pypi".
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/muni-lcc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
